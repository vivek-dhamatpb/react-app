AWSTemplateFormatVersion: '2010-09-09'
Description: EC2 instance in default VPC with open HTTP access

Parameters:
  DefaultVPC:
    Type: AWS::EC2::VPC::Id
    Description: Default VPC ID

  DefaultSubnet:
    Type: AWS::EC2::Subnet::Id
    Description: Subnet ID in the default VPC

Resources:
  WebServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP from anywhere
      VpcId: !Ref DefaultVPC
      SecurityGroupIngress:
      - IpProtocol: tcp
        FromPort: 80
        ToPort: 80
        CidrIp: 0.0.0.0/0

  EC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t2.micro
      ImageId: ami-0c02fb55956c7d316 # Amazon Linux 2 (update for your region)
      SecurityGroupIds:
      - !Ref WebServerSecurityGroup
      SubnetId: !Ref DefaultSubnet
